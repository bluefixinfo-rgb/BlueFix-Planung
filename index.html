<style>
:root{--bg:#e9eff7;--sf:#ffffff;--sf2:#f2f6fb;--tx:#0b2545;--mu:#5a6c85;--ac:#1f6fe5;--bd:#d3dcea;--dg:#c8372d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1422;--sf:#141f33;--sf2:#1b2a43;--tx:#e6edf8;--mu:#97a8c2;--ac:#4d92ff;--bd:#2a3b57;--dg:#ff6b60;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1422;--sf:#141f33;--sf2:#1b2a43;--tx:#e6edf8;--mu:#97a8c2;--ac:#4d92ff;--bd:#2a3b57;--dg:#ff6b60;color-scheme:dark}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
header{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--sf);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px}
.mark{width:30px;height:30px;border-radius:8px;background:var(--ac);display:grid;place-items:center}
h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em;line-height:1}
h1 small{display:block;font-size:11px;font-weight:500;color:var(--mu);letter-spacing:0;margin-top:2px}
.room{display:flex;gap:8px;margin-left:auto;align-items:flex-end}
label{font-size:11px;color:var(--mu);display:flex;flex-direction:column;gap:3px}
input[type=number]{width:62px;padding:6px 7px;border:1px solid var(--bd);border-radius:7px;background:var(--sf2);color:var(--tx);font-size:14px}
input[type=color]{width:38px;height:32px;padding:2px;border:1px solid var(--bd);border-radius:7px;background:var(--sf2)}
#stage{flex:1;position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hint{position:absolute;left:10px;top:10px;font-size:11px;color:var(--mu);background:var(--sf);border:1px solid var(--bd);padding:5px 9px;border-radius:7px;pointer-events:none}
.tools{position:absolute;right:10px;top:10px}
button{font:inherit;font-size:14px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:8px 12px;border-radius:9px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.d{color:var(--dg)}
footer{background:var(--sf);border-top:1px solid var(--bd);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));max-height:46vh;overflow-y:auto}
#act{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--bd)}
#sn{font-weight:700;font-size:15px;width:100%}
.u{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--mu)}
#tabs{display:flex;gap:4px;margin-bottom:8px;overflow-x:auto}
.tab{border:0;background:none;color:var(--mu);padding:6px 11px;white-space:nowrap;border-radius:8px}
.tab.on{background:var(--ac);color:#fff}
#cat{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.card{flex:0 0 auto;text-align:left;background:var(--sf2);padding:8px 12px;min-width:112px}
.card b{display:block;font-size:14px}.card small{color:var(--mu);font-size:11px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}.ok{color:var(--ac);font-size:13px;align-self:center}
.pj{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.pj select,.pj input{padding:7px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--sf2);color:var(--tx);min-width:0;width:140px}
input[type=number],input[type=text],select{font-size:16px}
:root{--bg:#eef2f8;--sf:#ffffff;--sf2:#f3f6fb;--tx:#0f1b2d;--mu:#64748b;--ac:#2563eb;--bd:#e2e8f0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1120;--sf:#111b2e;--sf2:#18253d;--tx:#e8eef9;--mu:#94a3b8;--ac:#5b9bff;--bd:#25344f}}
header{box-shadow:0 8px 24px -16px rgba(15,27,45,.35)}
.mark{background:linear-gradient(135deg,#2563eb,#38bdf8);box-shadow:0 4px 12px -2px rgba(37,99,235,.5)}
button{border-radius:10px;font-weight:500;transition:background .15s,border-color .15s,transform .1s}
button:hover{border-color:var(--ac)}button:active{transform:scale(.97)}
button.p{background:linear-gradient(180deg,#3b82f6,#2563eb);border-color:#2563eb;color:#fff}
.card{border-radius:12px;padding:10px 14px}.card:hover{background:var(--sf)}
.tools{display:flex;flex-direction:column;gap:6px;align-items:flex-end}#msg{max-width:80%}

function toast(t){const m=$('msg');m.textContent=t;m.hidden=!t;clearTimeout(tt);if(t)tt=setTimeout(()=>m.hidden=true,5000)}
function setWalk(on){
  walk=on;select(null);if(on){wx=0;wz=dim.d/2-.6;wy=0;wp=0}
  C.fov=on?70:45;C.updateProjectionMatrix();wmat.opacity=on?.9:.3;$('joy').hidden=!on;jx=jy=0;$('knob').style.transform='';$('wk').textContent=on?'Rundgang beenden':'Rundgang';
  toast(on?'Joystick: gehen · Ziehen: umschauen · Laptop: WASD und Pfeiltasten':'');cam();
}
function size(g,w,h,d){const u=g.userData;u.w=w;u.h=h;u.d=d;g.scale.set(w/u.bw,h/u.bh,d/u.bd)}
function tint(g,col){const u=g.userData,c=CAT[u.t];u.col=col;const k=c.p[c.k||0][6];g.children.forEach(m=>{if(m.userData.o===k)m.material.color.set(col)})}
function mk(t,o){
  const c=CAT[t],g=new THREE.Group();g.userData={t,bw:c.bw,bh:c.bh,bd:c.bd,col:null};
  c.p.forEach(([w,h,d,x,y,z,col,s])=>{
    const m=new THREE.Mesh(s==='c'?new THREE.CylinderGeometry(w/2,w/2,h,28):new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial(s==='m'?{color:col,emissive:0x6f9fc4,emissiveIntensity:.35,roughness:.1,metalness:.2}:{color:col}));
    m.position.set(x,y,z);m.userData.o=col;m.castShadow=m.receiveShadow=true;g.add(m)});
  size(g,o.w||c.bw,o.h||c.bh,o.d||c.bd);if(o.col)tint(g,o.col);
  g.position.set(o.x||0,0,o.z||0);g.rotation.y=o.r||0;clamp(g);S.add(g);items.push(g);walls();return g;
}
function fill(){
  if(!selI)return;const u=selI.userData,c=CAT[u.t];
  $('sn').textContent=c.n;$('fw').value=Math.round(u.w*100);$('fd').value=Math.round(u.d*100);$('fh').value=Math.round(u.h*100);
  $('fc').value=u.col||'#'+new THREE.Color(c.p[c.k||0][6]).getHexString();
}
function select(it){
  selI=it;if(bh){S.remove(bh);bh=null}
  if(it){bh=new THREE.BoxHelper(it,0x1f6fe5);S.add(bh);fill()}
  $('act').hidden=!it;
}
function sel(){if(bh)bh.update();if(selI&&CAT[selI.userData.t].wl)walls()}
let DB={cur:'',list:[]};
const curP=()=>DB.list.find(p=>p.id===DB.cur);
const ser=g=>{const u=g.userData;return{t:u.t,x:g.position.x,z:g.position.z,r:g.rotation.y,w:u.w,h:u.h,d:u.d,col:u.col}};
function persist(){try{localStorage.setItem('bluefix-db',JSON.stringify(DB))}catch(e){}}
function save(){const p=curP();if(p){p.dim={...dim};p.items=items.map(ser)}persist()}
function loadDB(){
  try{const s=JSON.parse(localStorage.getItem('bluefix-db')||'null');if(s&&s.list&&s.list.length)DB=s;
    else{const o=JSON.parse(localStorage.getItem('bluefix-room')||'null');if(o&&o.dim)DB={cur:'p1',list:[{id:'p1',name:'Mein Zimmer',dim:o.dim,items:o.items||[]}]}}}catch(e){}
  if(!DB.list.length)DB={cur:'p1',list:[{id:'p1',name:'Mein Zimmer',dim:{w:4,d:4,h:2.5},items:[]}]};
  if(!curP())DB.cur=DB.list[0].id;
}
function show(){
  items.forEach(g=>S.remove(g));items.length=0;select(null);
  const p=curP();Object.assign(dim,{w:4,d:4,h:2.5},p.dim);
  p.items.forEach(i=>CAT[i.t]&&mk(i.t,i));
  ['dw','dd','dh'].forEach((id,i)=>$(id).value=dim['whd'[i]]);
  buildRoom();fit();pjui();
}
function pjui(){const s=$('pj');s.innerHTML='';DB.list.forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.name;s.appendChild(o)});s.value=DB.cur;$('pn').value=curP().name}
// Pointer
const rc=new THREE.Raycaster(),pl=new THREE.Plane(new THREE.Vector3(0,1,0),0),v=new THREE.Vector3(),m2=new THREE.Vector2();
function ray(e){const r=cv.getBoundingClientRect();m2.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);rc.setFromCamera(m2,C)}
function floorPt(e){ray(e);return rc.ray.intersectPlane(pl,v)}
function pick(e){ray(e);const h=rc.intersectObjects(items,true)[0];if(!h)return null;let o=h.object;while(o.parent&&!o.userData.t)o=o.parent;return o}
const P=new Map();let drag=null,last=1;
const pd=()=>{const a=[...P.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1};
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(P.size===1){const it=walk?null:pick(e);if(it!==selI)select(it);drag=null;
    if(it){const p=floorPt(e);if(p)drag={it,ox:it.position.x-p.x,oz:it.position.z-p.z}}}
  else{drag=null;last=pd()}
});
cv.addEventListener('pointermove',e=>{
  const o=P.get(e.pointerId);if(!o)return;
  const dx=e.clientX-o.x,dy=e.clientY-o.y;o.x=e.clientX;o.y=e.clientY;o.m=(o.m||0)+Math.abs(dx)+Math.abs(dy);
  if(P.size>=2){const d=pd();dist=Math.min(25,Math.max(2,dist*last/d));last=d;cam()}
  else if(drag){const p=floorPt(e);if(p){drag.it.position.x=p.x+drag.ox;drag.it.position.z=p.z+drag.oz;clamp(drag.it);sel()}}
  else if(walk){wy+=dx*.005;wp=Math.max(-1.2,Math.min(1.2,wp+dy*.005));cam()}
  else{th-=dx*.008;ph=Math.min(1.5,Math.max(.02,ph-dy*.008));cam()}
});
const up=e=>{const o=P.get(e.pointerId);P.delete(e.pointerId);
  if(walk&&o&&(o.m||0)<8&&P.size===0&&e.type==='pointerup'){const p=floorPt(e);if(p){wx=Math.max(-dim.w/2+.3,Math.min(dim.w/2-.3,p.x));wz=Math.max(-dim.d/2+.3,Math.min(dim.d/2-.3,p.z));cam()}}
  if(drag)save();drag=null};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();dist=Math.min(25,Math.max(2,dist*(1+e.deltaY*.001)));cam()},{passive:false});
// UI
function tabs(){
  $('tabs').innerHTML='';$('cat').innerHTML='';
  Object.keys(TABS).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.className='tab'+(k===curTab?' on':'');b.onclick=()=>{curTab=k;tabs()};$('tabs').appendChild(b)});
  TABS[curTab].forEach(t=>{const c=CAT[t],b=document.createElement('button');b.className='card';
    b.innerHTML='<b>'+c.n+'</b><small>'+Math.round(c.bw*100)+' × '+Math.round(c.bd*100)+' cm</small>';
    b.onclick=()=>{select(mk(t,{}));save()};$('cat').appendChild(b)});
}
let nt;const note=t=>{$('st').textContent=t;clearTimeout(nt);nt=setTimeout(()=>$('st').textContent='',2200)};
const cl=(id,mn,mx,cur)=>{const n=parseFloat($(id).value)/100;return isNaN(n)?cur:Math.min(mx,Math.max(mn,n))};
function apply(){if(!selI)return;const u=selI.userData;size(selI,cl('fw',.05,5,u.w),cl('fh',.01,3,u.h),cl('fd',.05,5,u.d));clamp(selI);sel();fill();save();note('Grösse gespeichert')}
$('ap').onclick=apply;
['fw','fd','fh'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')apply()}));
$('pj').onchange=()=>{save();DB.cur=$('pj').value;show()};
$('pn').onchange=()=>{curP().name=$('pn').value.trim()||'Projekt';pjui();persist()};
$('pnew').onclick=()=>{save();const id='p'+Date.now();DB.list.push({id,name:'Projekt '+(DB.list.length+1),dim:{w:4,d:4,h:2.5},items:[]});DB.cur=id;show();persist()};
let dt;const pd2=$('pdel');
pd2.onclick=()=>{
  if(!pd2.dataset.arm){pd2.dataset.arm=1;pd2.textContent='Wirklich löschen?';dt=setTimeout(()=>{delete pd2.dataset.arm;pd2.textContent='Projekt löschen'},3000);return}
  clearTimeout(dt);delete pd2.dataset.arm;pd2.textContent='Projekt löschen';closeDD();
  const i=DB.list.findIndex(p=>p.id===DB.cur);DB.list.splice(i,1);
  if(!DB.list.length)DB.list.push({id:'p'+Date.now(),name:'Mein Zimmer',dim:{w:4,d:4,h:2.5},items:[]});
  DB.cur=DB.list[Math.max(0,i-1)].id;show();persist();
};
$('fc').addEventListener('input',()=>{if(selI)tint(selI,$('fc').value)});
$('fc').addEventListener('change',save);
$('rot').onclick=()=>{if(!selI)return;selI.rotation.y+=Math.PI/2;clamp(selI);sel();save()};
$('dup').onclick=()=>{if(!selI)return;const u=selI.userData;select(mk(u.t,{x:selI.position.x+.3,z:selI.position.z+.3,r:selI.rotation.y,w:u.w,h:u.h,d:u.d,col:u.col}));save()};
$('del').onclick=()=>{if(!selI)return;S.remove(selI);items.splice(items.indexOf(selI),1);select(null);walls();save()};
$('top').onclick=()=>{if(walk)setWalk(false);if(ph>.1){ph=.02;$('top').textContent='Schräg'}else{ph=.9;$('top').textContent='Von oben'}cam()};
[['dw','w',2,12],['dd','d',2,12],['dh','h',2,4]].forEach(([id,k,mn,mx])=>$(id).addEventListener('change',()=>{
  const n=parseFloat($(id).value);if(!isNaN(n))dim[k]=Math.min(mx,Math.max(mn,n));$(id).value=dim[k];buildRoom();fit();save();
}));
new ResizeObserver(()=>{const r=stage.getBoundingClientRect();if(!r.width||!r.height)return;R.setSize(r.width,r.height,false);C.aspect=r.width/r.height;C.updateProjectionMatrix()}).observe(stage);
loadDB();tabs();show();toast('Ziehen: drehen · Zwei Finger: zoomen · Möbel antippen und verschieben');
addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test((document.activeElement||{}).tagName||''))return;if(e.key==='Delete'||e.key==='Backspace')$('del').click();if(e.key==='r'||e.key==='R')$('rot').click()});
let ret,root,hs=null,xs=null,placed=false;
R.setAnimationLoop((t,f)=>{if(f&&hs){const r=f.getHitTestResults(hs);if(r.length){ret.visible=true;ret.matrix.fromArray(r[0].getPose(R.xr.getReferenceSpace()).transform.matrix)}else ret.visible=false}if(walk)stepWalk(t);R.render(S,C)});
function closeDD(){document.querySelectorAll('.ddm').forEach(m=>m.hidden=true)}
document.querySelectorAll('.dd').forEach(dd=>{const b=dd.querySelector('.ddb'),m=dd.querySelector('.ddm');
  b.onclick=e=>{e.stopPropagation();const was=!m.hidden;closeDD();if(was)return;m.hidden=false;
    const r=b.getBoundingClientRect(),mw=m.offsetWidth,mh=m.offsetHeight;
    m.style.left=Math.max(8,Math.min(r.left,innerWidth-mw-8))+'px';
    m.style.top=(r.bottom+mh+12>innerHeight?Math.max(8,r.top-mh-6):r.bottom+6)+'px'};
  m.addEventListener('click',e=>{const t=e.target.closest('button');if(t&&!t.dataset.keep)closeDD();e.stopPropagation()})});
document.addEventListener('click',closeDD);addEventListener('resize',closeDD);
let lt=0,jx=0,jy=0;const keys=new Set();
const blocked=(x,z)=>items.some(g=>{const u=g.userData;if(u.h<.3||CAT[u.t].wl)return false;const dx=x-g.position.x,dz=z-g.position.z,c=Math.cos(g.rotation.y),s=Math.sin(g.rotation.y);return Math.abs(dx*c-dz*s)<u.w/2+.2&&Math.abs(dx*s+dz*c)<u.d/2+.2});
function stepWalk(t){
  const dt=Math.min(.05,(t-lt)/1000||0);lt=t;
  let f=-jy,s=jx,tr=0;
  if(keys.has('arrowup')||keys.has('w'))f+=1;if(keys.has('arrowdown')||keys.has('s'))f-=1;
  if(keys.has('d'))s+=1;if(keys.has('a'))s-=1;
  if(keys.has('arrowleft'))tr+=1;if(keys.has('arrowright'))tr-=1;
  const n=Math.hypot(f,s);if(n>1){f/=n;s/=n}
  if(!f&&!s&&!tr)return;
  wy+=tr*1.8*dt;const sp=1.7*dt;
  const nx=Math.max(-dim.w/2+.3,Math.min(dim.w/2-.3,wx+(-Math.sin(wy)*f+Math.cos(wy)*s)*sp)),nz=Math.max(-dim.d/2+.3,Math.min(dim.d/2-.3,wz+(-Math.cos(wy)*f-Math.sin(wy)*s)*sp));
  const st=blocked(wx,wz);if(st||!blocked(nx,wz))wx=nx;if(st||!blocked(wx,nz))wz=nz;
  cam();
}
const joy=$('joy'),kn=$('knob');
const jm=e=>{const r=joy.getBoundingClientRect(),m=r.width/2-10;let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const l=Math.hypot(dx,dy);if(l>m){dx*=m/l;dy*=m/l}jx=dx/m;jy=dy/m;kn.style.transform='translate('+dx+'px,'+dy+'px)'};
joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);jm(e)});
joy.addEventListener('pointermove',e=>{if(joy.hasPointerCapture(e.pointerId))jm(e)});
const jr=()=>{jx=jy=0;kn.style.transform=''};
joy.addEventListener('pointerup',jr);joy.addEventListener('pointercancel',jr);
addEventListener('keydown',e=>keys.add(e.key.toLowerCase()));addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());
$('wk').onclick=()=>setWalk(!walk);

$('arb').onclick=async()=>{
  let ok=false;try{ok=!!(navigator.xr&&await navigator.xr.isSessionSupported('immersive-ar'))}catch(e){}
  if(!ok){toast('AR geht nur mit Chrome auf Android. Auf iPhone und Laptop nutze den Rundgang.');return}
  try{
    setWalk(false);select(null);
    const s=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['hit-test'],optionalFeatures:['dom-overlay'],domOverlay:{root:$('arui')}});
    xs=s;await R.xr.setSession(s);$('arui').hidden=false;S.background=null;$('arhint').textContent='Boden anvisieren und tippen, um den Raum zu platzieren.';
    if(!ret){ret=new THREE.Mesh(new THREE.RingGeometry(.12,.17,32).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0x2563eb}));ret.matrixAutoUpdate=false;ret.visible=false;S.add(ret);root=new THREE.Group()}
    hs=await s.requestHitTestSource({space:await s.requestReferenceSpace('viewer')});
    s.addEventListener('select',()=>{if(!ret.visible)return;root.position.setFromMatrixPosition(ret.matrix);
      if(!placed){S.add(root);[room,...items].forEach(o=>root.add(o));placed=true;$('arhint').textContent='Platziert. Erneut tippen verschiebt den Raum.'}});
    s.addEventListener('end',()=>{hs=null;xs=null;ret.visible=false;[room,...items].forEach(o=>S.add(o));S.remove(root);root.position.set(0,0,0);placed=false;$('arui').hidden=true;bg();cam()});
  }catch(err){toast('AR konnte nicht gestartet werden.')}
};
$('arx').onclick=()=>xs&&xs.end();
</script>
</body></html>
